[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-database-migration"
version = "0.1.0"
description = "MDM: Multi-Environment Database Migration CLI & Library built on Alembic, SQLAlchemy, and SQLModel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gustavo Furtado", email = "gufurtado02@gmail.com" }
]
maintainers = [
    { name = "Gustavo Furtado", email = "gufurtado02@gmail.com" }
]
keywords = ["alembic", "sqlalchemy", "sqlmodel", "migrations", "cli", "multi-database", "multi-environment", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/Gustav0Furtad0/multi_database_migration"
Repository = "https://github.com/Gustav0Furtad0/multi_database_migration"
Issues = "https://github.com/Gustav0Furtad0/multi_database_migration/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mdm = "ethermig.cli:app"
ethermig = "ethermig.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ethermig*"]
